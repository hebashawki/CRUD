<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>CRUD System</title>
</head>
<body>
<div class="w-75 m-auto py-4">
    <h1 CLASS="text-center">CRUD SYSTEM</h1>
    <label for="pn">Product Name</label>
    <input type="text" id="pn" class="form-control mb-3" placeholder='Product Name...'>

    <label for="pp">Product Price</label>
    <input type="number" id="pp" class="form-control mb-3" placeholder='Product Price...'>

    <label for="pc">Product Category</label>
    <input type="text" id="pc" class="form-control mb-3" placeholder='Product Category...'>

    <label for="pd">Product Description</label>
    <textarea  id="pd" class="form-control mb-3" placeholder='Product Description...'></textarea>

    <button onclick="addNewProduct()" class="btn btn-outline-info btn-large">Add</button>
<input onkeyup ="searchedElement( this.value )"  type="text" name="search" id="search" class="form-control my-3" placeholder="search...">
    <table class="table mt-4 table-striped text-center">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Description</th>
                <th>Delete</th>
                <th>Update</th>
            </tr>
        </thead>
        <tbody id="tbody">
            
        </tbody>
    </table>
</div>





    <script src="js/bootstrap.bundle.min.js"></script>
   <script src="js/main.js"></script> 
</body>
</html>
